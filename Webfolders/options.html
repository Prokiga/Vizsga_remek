<!DOCTYPE html>
<html>

<head>
    <title>
        Színes Négy Évszak
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <style>
        body {
            background-color: rgb(57, 151, 189);
        }

        .designbox {
            border: 3px solid chocolate;
            border-radius: 1rem;
            padding: 1rem;
            background-color: lightcyan;
            margin-top: 2rem;
        }

        .insidebox {
            border: 1px solid chocolate;
            border-radius: 1rem;
            padding: 1rem;
            background-color: lightyellow;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <main class="container mt-5">
        <header class="text-center mb3">
            <img src="images/Logo_img.png" alt="Logo" width="100" height="100">
            <img src="images/Logo_text.png" alt="Színes Négy Évszak" height="100">
        </header>
        <section class="card designbox">
            <div class="card-header display-6">
                Lehetőségek:
            </div>
            <div class="row">
                <div class="col-lg-6">
                    <div class="card insidebox">
                        <div class="card-body">
                            <div class="card-header display-6">
                                Fenyő bála
                            </div>
                            <table class="table text-center">
                                <thead class="table-warning">
                                    <tr>
                                        <th></th>
                                        <th>Lucfenyő</th>
                                        <th>Jegyenye</th>
                                        <th>Normand</th>
                                        <th>Nobilis</th>
                                    </tr>
                                    <tr>
                                        <td>Raktáron:</td>
                                        <td>30</td>
                                        <td>25</td>
                                        <td>41</td>
                                        <td>8</td>
                                    </tr>
                                </thead>
                            </table>
                        </div>
                        <div class="mt-auto p-3">
                            <a href="Pinebase.html" class="btn btn-primary">Részletek</a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card insidebox">
                        <div class="card-body">
                            <div class="card-header display-6">
                                Koszorú alap
                            </div>
                            <table class="table text-center">
                                <thead class="table-warning">
                                    <tr>
                                        <th></th>
                                        <th>Nagy</th>
                                        <th>Kicsi</th>
                                    </tr>
                                    <tr>
                                        <td>Folyamatban:</td>
                                        <td>15</td>
                                        <td>30</td>
                                    </tr>
                                </thead>
                            </table>
                        </div>
                        <div class="mt-auto p-3">
                            <a href="#" class="btn btn-primary">Részletek</a>
                        </div>
                    </div>
                </div>

            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="card insidebox">
                        <div class="card-body">
                            <div class="card-header display-6">
                                Virág rendelés
                            </div>
                        </div>
                        <div class="mt-auto p-3">
                            <a href="#" class="btn btn-primary">Részletek</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
