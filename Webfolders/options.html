<!DOCTYPE html>
<html>

<head>
    <title>
        Színes Négy Évszak
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <style>
        body {
            background-color: rgb(57, 151, 189);
        }

        .designbox {
            border: 3px solid chocolate;
            border-radius: 1rem;
            padding: 1rem;
            background-color: lightcyan;
            margin-top: 2rem;
        }

        .insidebox {
            border: 1px solid chocolate;
            border-radius: 1rem;
            padding: 1rem;
            background-color: lightyellow;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <main class="container mt-5">
        <header class="text-center mb3">
            <img src="images/Logo.png" alt="Logo" width="100" height="100">
        </header>
        <section class="card designbox">
            <div class="card-header display-6">
                Színes Négy Évszak
            </div>
            <div class="row">
                <div class="col-sm-4 col-md-4">
                    <div class="card insidebox">
                        <div class="card-body">
                            <div class="card-header display-6">
                                Fenyő bála
                            </div>
                            <img src="images/Logo.png" alt="Fenyő" width="100" height="100" >
                        </div>
                        <div class="mt-auto p-3">
                            <a href="#" class="btn btn-primary">Részletek</a>
                        </div>
                    </div>
                </div>

                <div class="col-sm-4 col-md-4">
                    <div class="card insidebox">
                        <div class="card-body">
                            <div class="card-header display-6">
                                Koszorú alap
                            </div>
                            <img src="images/Logo.png" alt="Koszorú" width="100" height="100">
                        </div>
                        <div class="mt-auto p-3">
                            <a href="#" class="btn btn-primary">Részletek</a>
                        </div>
                    </div>
                </div>

                <div class="col-sm-4 col-md-4">
                    <div class="card insidebox">
                        <div class="card-body">
                            <div class="card-header display-6">
                                Virág rendelés
                            </div>
                            <img src="images/Logo.png" alt="Koszorú" width="100" height="100">
                        </div>
                        <div class="mt-auto p-3">
                            <a href="#" class="btn btn-primary">Részletek</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
