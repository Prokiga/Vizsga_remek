<!DOCTYPE html>
<html lang="hu">

<head>
    <title>
        Színes Négy Évszak
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <style>
        body {
            background-color: rgb(57, 151, 189);
        }

        .designbox {
            border: 3px solid chocolate;
            border-radius: 1rem;
            padding: 1rem;
            background-color: lightcyan;
            margin-top: 2rem;
        }

        .insidebox {
            border: 1px solid chocolate;
            border-radius: 1rem;
            padding: 1rem;
            background-color: lightyellow;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <main class="container py-5">
        <header class="text-center mb3">
            <img src="images/Logo_img.png" alt="Logo" width="100" height="100">
            <img src="images/Logo_text.png" alt="Színes Négy Évszak" height="100">
        </header>
        <section class="card designbox mx-auto p-3">
            <div class="card-header display-6 justify-content-center">
                Fenyő bála
            </div>
            <div class="card-body">
                <div class="card insidebox">
                    <div class="card-body">
                        <div class="card-header display-6">
                            Bálák
                        </div>
                        <table class="table text-center">
                            <thead class="table-warning">
                                <tr>
                                    <th></th>
                                    <th>Lucfenyő</th>
                                    <th>Jegyenye</th>
                                    <th>Normand</th>
                                    <th>Nobilis</th>
                                </tr>
                                <tr>
                                    <th>Érkezett:</th>
                                    <td>30</td>
                                    <td>25</td>
                                    <td>41</td>
                                    <td>8</td>
                                </tr>
                                <tr>
                                    <th>Ati elvitt:</th>
                                    <td>25</td>
                                    <td>20</td>
                                    <td>36</td>
                                    <td>3</td>
                                </tr>
                                <tr>
                                    <th>Eladva:</th>
                                    <td>3</td>
                                    <td>2</td>
                                    <td>4</td>
                                    <td>80</td>
                                </tr>
                                <tr>
                                    <th>Lekötve:</th>
                                    <td>10</td>
                                    <td>2</td>
                                    <td>4</td>
                                    <td>8</td>
                                </tr>
                                <tr>
                                    <th>Eltéve:</th>
                                    <td>36</td>
                                    <td>5</td>
                                    <td>1</td>
                                    <td>18</td>
                                </tr>
                                <tr>
                                    <th>Maradt:</th>
                                    <td>30</td>
                                    <td>25</td>
                                    <td>41</td>
                                    <td>8</td>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
