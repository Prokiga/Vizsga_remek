<!DOCTYPE html>
<html lang="hu">

<head>
    <title>Színes Négy Évszak</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navigáció a Vissza gombhoz -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="options.html" style="color: var(--primary-color); font-weight: bold;">&larr;
                Vissza a főmenübe</a>
        </div>
    </nav>

    <main class="container mb-5">
        <header class="text-center mb-4">
            <h2 class="display-6" style="color: var(--primary-color);">Vásárlók</h2>
            <p class="text-muted">Az adatok az adatbázisból töltődnek be (jelenleg csak szimulálva a böngészőben).</p>
        </header>
        <!-- KOSZORÚALAP SZEKCIÓ -->
        <div class="container-fluid mb-5">
            <div class="row g-3">
                <!-- 1/3 szélesség -->
                <div class="col-lg-4">
                    <section class="card designbox h-100">
                        <div class="card-header text-center">
                            <h2 class="display-6" style="color:  var(--primary-color);">Új vásárló</h2>
                        </div>
                        <div class="card-body overflow-auto">
                            <!-- Ide kerül az első táblázat -->
                            <table class="table table-hover text-center align-middle">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Új vásárló hozzáadása:</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>
                                            <label for="costumer_name">Név:</label>
                                            <input type="text" name="A vevő neve">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="costumer_taxnumber">Adószám:</label>
                                            <input type="text" name="A vevő adószám">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="costumer_postal_code">Ir.szám:</label>
                                            <input type="text" name="Irányítószám">

                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="costumer_city">Város:</label>
                                            <input type="text" name="Város">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="costumer_address">Cím:</label>
                                            <input type="text" name="Cím">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label for="costumer_email">E-mail cím:</label>
                                            <input type="email" name="E-mail">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <button class="btn-primary">Mentés</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
                <!--2/3-ad rész -->
                <div class="col-lg-8">
                    <section class="card designbox h-100">
                        <div class="card-header text-center">
                            <h2 class="display-6" style="color:  var(--primary-color);">Regisztrált Vásárlók adatai</h2>
                        </div>
                        <div class="card-body overflow-auto">
                            <table class="table table-hover text-center align-middle">
                                <thead class="table-warning">
                                    <tr>
                                        <th>Név</th>
                                        <th>Irányítószám</th>
                                        <th>Város</th>
                                        <th>Cím</th>
                                        <th>E-mail cím</th>
                                        <th>Adószám</th>
                                    </tr>
                                </thead>
                                <!-- Az id="wreathTableBody" segítségével a JS ide fogja betölteni az adatokat -->
                                <tbody id="costumersTableBody">
                                    <tr>
                                        <td colspan="6">Adatok betöltése folyamatban...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
    <script>
        // Amikor betölt az oldal, azonnal hívjuk meg a táblázat rajzoló funkciókat
        document.addEventListener('DOMContentLoaded', () => {
            loadCostumersData();
        });
    </script>
</body>

</html>
