<!DOCTYPE html>
<html lang="hu">

<head>
    <title>Színes Négy Évszak</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navigáció a Vissza gombhoz -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="Options.html" style="color: var(--primary-color); font-weight: bold;">&larr;
                Vissza a főmenübe</a>
        </div>
    </nav>

    <main class="container mb-5">
        <header class="text-center mb-4">
            <h2 class="display-6" style="color: var(--primary-color);">Koszorúalap készletnyilvántartás</h2>
            <p class="text-muted">Az adatok az adatbázisból töltődnek be (jelenleg csak szimulálva a böngészőben).</p>
        </header>
        <!-- KOSZORÚALAP SZEKCIÓ -->
        <div class="container-fluid mb-5">
            <div class="row g-3">
                <!-- 1/3 szélesség -->
                <div class="col-lg-4">
                    <section class="card designbox h-100">
                        <div class="card-header text-center">
                            <h2 class="display-6" style="color:  var(--primary-color);">Új rendelés</h2>
                        </div>
                        <div class="card-body overflow-auto">
                            <!-- Ide kerül az első táblázat -->
                            <table class="table table-hover text-center align-middle">
                                <thead class="table-primary">
                                    <tr>
                                        <th colspan="2">Új rendelés hozzáadása:</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>
                                            <label class="new-order-label" for="costumer_name">Vásárló</label>
                                        </td>
                                        <td>
                                            <select id="costumer_name" class="form-control" name="Vevő">
                                                <option value="">-- Válassz --</option>
                                                <option value="">Kriszta</option>
                                                <option value="">Géza</option>
                                                <option value="">István</option>

                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label class="new-order-label" for="base_type">Alap típus:</label>
                                        </td>
                                        <td>
                                            <select id="base_type" class="form-control" name="Fenyőtípus">
                                                <option value="">-- Válassz --</option>
                                                <option value="Small">Kicsi</option>
                                                <option value="Big">Nagy</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label class="new-order-label" for="deadline">Határidő</label>
                                        </td>
                                        <td>
                                            <input id="deadline" class="form-control" type="date" name="Határidő">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label class="new-order-label" for="number_of_pieces">Darabszám:</label>
                                        </td>
                                        <td>
                                            <input id="number_of_pieces" class="form-control" type="number" name="darabszám">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="2">
                                            <button class="btn btn-primary w-75">Mentés</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
                <!--2/3-ad rész -->
                <div class="col-lg-8">
                    <section class="card designbox h-100">
                        <div class="card-header text-center">
                           <h2 class="display-6" style="color:  var(--primary-color);">Raktári adatok</h2>
                        </div>
                        <div class="card-body overflow-auto">
                            <table class="table table-hover text-center align-middle">
                                <thead class="table-warning">
                                    <tr>
                                        <th>Kinek</th>
                                        <th>Mikorra</th>
                                        <th>Kicsi</th>
                                        <th>Kész (pipa)</th>
                                        <th>Nagy</th>
                                        <th>Kész (pipa)</th>
                                    </tr>
                                </thead>
                                <!-- Az id="wreathTableBody" segítségével a JS ide fogja betölteni az adatokat -->
                                <tbody id="wreathTableBody">
                                    <tr>
                                        <td colspan="6">Adatok betöltése folyamatban...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
    <script>
        // Amikor betölt az oldal, azonnal hívjuk meg a táblázat rajzoló funkciókat
        document.addEventListener('DOMContentLoaded', () => {
            loadWreathData();
        });
    </script>
</body>

</html>
